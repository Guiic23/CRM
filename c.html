<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Leads</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            margin: 0;
            font-size: 1.2em;
            color: #94a3b8;
        }

        .card h1 {
            margin: 10px 0 0 0;
            font-size: 2em;
            color: #22c55e;
        }

        input,
        button,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
        }

        input,
        textarea {
            background: #334155;
            color: #fff;
        }

        button {
            background: #22c55e;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #334155;
            text-align: left;
        }

        th {
            background: #1e293b;
        }

        .actions button {
            background: #3b82f6;
            color: #fff;
            margin-right: 5px;
        }

        .actions button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>CRM Leads FY</h1>
    </div>

    <div class="cards">
        <div class="card">
            <h3>Total</h3>
            <h1 id="total">0</h1>
        </div>
        <div class="card">
            <h3>Novos</h3>
            <h1 id="novo">0</h1>
        </div>
        <div class="card">
            <h3>Em Andamento</h3>
            <h1 id="andamento">0</h1>
        </div>
        <div class="card">
            <h3>Fechados</h3>
            <h1 id="fechado">0</h1>
        </div>
        <div class="card">
            <h3>Faturamento</h3>
            <h1 id="faturamento">R$0</h1>
        </div>
    </div>

    <div>
        <input type="text" id="company" placeholder="Empresa">
        <input type="text" id="phone" placeholder="Telefone">
        <button onclick="adicionarLead()">Adicionar Lead</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Empresa</th>
                <th>Telefone</th>
                <th>Status</th>
                <th>Ação</th>
                <th>Observações</th>
            </tr>
        </thead>
        <tbody id="tbody">
            <!-- Leads serão carregados aqui -->
        </tbody>
    </table>

    <script>
        // Configurações do Supabase
        const SUPABASE_URL = 'https://qfmjymzqubsikfvvlxrl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zuqaF4d8wKP-WXG1v9PjFQ_d07kQmh4';
        const { createClient } = supabase;

        const db = createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        let leads = [];

        // Carrega os leads do banco
        async function carregarLeads() {
            const { data, error } = await db
                .from('leads')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Erro ao carregar leads:', error);
                return;
            }

            leads = data || [];
            renderDashboard();
            renderTabela();
        }

        // Renderiza o dashboard
        function renderDashboard() {
            document.getElementById('total').innerText = leads.length;
            document.getElementById('novo').innerText = leads.filter(l => l.status === 'novo').length;
            document.getElementById('andamento').innerText = leads.filter(l => l.status === 'andamento').length;
            document.getElementById('fechado').innerText = leads.filter(l => l.status === 'fechado').length;

            const faturamento = leads
                .filter(l => l.status === 'fechado')
                .reduce((acc, l) => acc + Number(l.estimated_value || 0), 0);

            document.getElementById('faturamento').innerText = 'R$ ' + faturamento;
        }

        // Renderiza a tabela de leads
        function renderTabela() {
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            const leadsOrdenados = [...leads].sort((a, b) => {

                const ordem = {
                    novo: 1,
                    andamento: 2,
                    nao_respondeu: 3,
                    fechado: 4
                };

                return ordem[a.status] - ordem[b.status];
            });

            leadsOrdenados.forEach(lead => {
                tbody.innerHTML += `
          <tr>
            <td>${lead.company}</td>
            <td>${lead.phone || ''}</td>
            <td>
              <select style="font-weight:bold; background: ${lead.status === 'fechado' ? '#166534' :
             lead.status === 'andamento' ? '#1d4ed8' :
             lead.status === 'nao_respondeu' ? '#92400e' :'#334155'};color:white" onchange="alterarStatus('${lead.id}',this.value)">
                <option value="novo" ${lead.status === 'novo' ? 'selected' : ''}>Novo</option>
                <option value="andamento" ${lead.status === 'andamento' ? 'selected' : ''}>Em Andamento</option>
                <option value="nao_respondeu" ${lead.status === 'nao_respondeu' ? 'selected' : ''}>Não Respondeu</option>
                <option value="fechado" ${lead.status === 'fechado' ? 'selected' : ''}>Fechado</option>
              </select>
            </td>
            <td class="actions">
              <button onclick="abrirWhats('${lead.company}', '${lead.phone}')">WhatsApp</button>
              <button onclick="excluirLead('${lead.id}')" style="background:#ef4444;margin-top:5px"> 🗑 Excluir </button>
              </td>
            <td>
              <textarea id="note_${lead.id}" rows="2" placeholder="Adicione uma nota">${lead.notes || ''}</textarea>
              <button onclick="salvarNota('${lead.id}')">Salvar</button>
              
            </td>
          </tr>
        `;
            });
        }


        // Exclui um lead
        async function excluirLead(id) {
            if (!confirm('Tem certeza que deseja excluir este lead?')) {
                return;
            }

            const { error } = await db
                .from('leads')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('Erro ao excluir lead:', error);
                alert('Erro ao excluir lead.');
                return;
            }

            carregarLeads();
        }

        // Adiciona um lead
        async function adicionarLead() {

            const company =
                document.getElementById("company").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            if (!company) {
                alert("Digite a empresa");
                return;
            }

            const { data, error } =
                await db
                    .from("leads")
                    .insert({
                        company,
                        phone,
                        status: "novo",
                        source: "manual",
                        score: 0,
                        estimated_value: 0,
                        notes: ""
                    })
                    .select();

            console.log("DATA:", data);
            console.log("ERROR:", error);

            if (error) {
                alert(error.message);
                return;
            }

            document.getElementById("company").value = "";
            document.getElementById("phone").value = "";

            carregarLeads();
        }

        // Altera o status de um lead
        async function alterarStatus(id, status) {
            const { error } = await db
                .from('leads')
                .update({ status: status, updated_at: new Date() })
                .eq('id', id);

            if (error) {
                console.error('Erro ao atualizar status:', error);
                alert('Erro ao atualizar status.');
                return;
            }

            carregarLeads();
        }

        // Salva uma nota para um lead
        async function salvarNota(id) {
            const nota = document.getElementById('note_' + id).value;

            const { error } = await db
                .from('leads')
                .update({ notes: nota })
                .eq('id', id);

            if (error) {
                console.error('Erro ao salvar nota:', error);
                alert('Erro ao salvar nota.');
                return;
            }

            alert('Nota salva com sucesso!');
        }

        // Abre o WhatsApp com mensagem personalizada
        // Abre o WhatsApp com mensagem personalizada
        function abrirWhats(nome, telefone) {
            const numero = telefone.replace(/\D/g, '');

            const mensagem = encodeURIComponent(`Olá ${nome}, tudo bem?

Prazer, me chamo Guilherme e sou responsável pela AlignRise. Trabalho ajudando empresas a construírem estruturas web focadas em fortalecer negócios no meio digital, transmitindo mais profissionalismo, posicionamento e autoridade no mercado.

Estava pesquisando na internet e acabei encontrando o perfil da sua empresa. Achei muito organizada com um propósito claro e o ramo de atuação bastante promissor — parabéns pelo trabalho!

Enquanto analisava o perfil de vocês, encontrei uma oportunidade que acredito que vai agregar bastante no posicionamento digital, e tenho certeza de que ajudaria no crescimento da empresa.

Posso te explicar rapidamente essa ideia?`);
            window.open(
                `https://wa.me/55${numero}?text=${mensagem}`,
                '_blank'
            );
        }

        // Carrega os leads ao abrir a página
        window.onload = carregarLeads;
    </script>

</body>

</html>
